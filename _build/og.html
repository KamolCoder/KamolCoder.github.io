<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Source for assets/img/og.jpg (1200x630). Render with: node _build/og.js -->
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { background: #08090d; position: relative; font-family: var(--font); }
  .glow-a { position: absolute; width: 620px; height: 620px; right: -140px; top: -220px; border-radius: 50%; background: #7a7cff; filter: blur(120px); opacity: .45; }
  .glow-b { position: absolute; width: 480px; height: 480px; left: -200px; bottom: -260px; border-radius: 50%; background: #7cf5c6; filter: blur(120px); opacity: .25; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse at 30% 40%, #000 20%, transparent 75%); }
  .wrap { position: absolute; inset: 70px 80px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 16px; font-family: var(--display); font-weight: 700; font-size: 30px; color: #eef0f5; }
  .logo b { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--grad); color: #05110c; font-weight: 800; font-size: 28px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: 74px; line-height: 1.05; letter-spacing: -.02em; color: #eef0f5; margin: auto 0 26px; }
  .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .row { display: flex; gap: 14px; }
  .row span { padding: 12px 24px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); font-family: var(--mono); font-size: 24px; color: #c8cdd8; background: rgba(255,255,255,.04); }
  .row span:first-child { background: #7cf5c6; color: #05110c; border-color: #7cf5c6; font-weight: 600; }
  .city { position: absolute; right: 0; top: 10px; font-family: var(--mono); font-size: 22px; color: #9097a8; }
</style>
</head>
<body>
  <div class="glow-a"></div><div class="glow-b"></div><div class="grid"></div>
  <div class="wrap">
    <div class="logo"><b>K</b><span>kamol<span style="color:#7cf5c6">.</span>dev</span></div>
    <div class="city">Tashkent · UZ</div>
    <h1>Web · Mobile · Desktop<br><span class="g">+ 1С · Telegram · Payme</span></h1>
    <div class="row"><span>Django</span><span>FastAPI</span><span>Flutter</span><span>PySide6</span><span>PostgreSQL</span></div>
  </div>
</body>
</html>
