<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="{{url}}">
  <link rel="alternate" hreflang="ru" href="{{urlRu}}">
  <link rel="alternate" hreflang="uz" href="{{urlUz}}">
  <link rel="alternate" hreflang="x-default" href="{{urlRu}}">
  <meta name="theme-color" content="#08090d">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="kamol.dev">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:locale:alternate" content="{{ogLocaleAlt}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{pageDescription}}">
  <meta property="og:image" content="{{site}}/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308090d'/%3E%3Cpath d='M20 16v32M20 32l16-16M26 27l14 21' stroke='%237cf5c6' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
{{preload}}
  <link rel="stylesheet" href="{{base}}assets/css/style.css">
  <script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__blob bg__blob--a"></div>
    <div class="bg__blob bg__blob--b"></div>
    <div class="bg__blob bg__blob--c"></div>
    <canvas class="bg__canvas" id="particles"></canvas>
  </div>
  <div class="cursor" aria-hidden="true"></div>
